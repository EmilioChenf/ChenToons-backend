services:
  - type: web
    name: chentoons-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: chentoons-postgres
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: chentoons-postgres
    plan: free
    databaseName: chentoons_db
    user: chentoons
    postgresMajorVersion: "16"
